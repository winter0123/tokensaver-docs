name: Build plugin bundles
on:
  workflow_dispatch:
    inputs:
      ref:
        description: Commit or tag to build
        type: string
        default: ''
  workflow_call:
    inputs:
      ref:
        type: string
        default: ''
permissions:
  contents: read
jobs:
  build:
    env:
      PYTHONUTF8: "1"
    strategy:
      matrix:
        os: [macos-15, macos-15-intel, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: oven-sh/setup-bun@v2
      - run: python -m pip install '.[mcp,tokens]' 'pyinstaller>=6,<7' 'cmake>=3.26,<5'
      - run: bun install --cwd plugins/opencode --frozen-lockfile
      - run: python -m unittest discover -s tests -v
      - run: python scripts/build_whisper.py --output dist/whisper
      - run: python scripts/build_standalone.py --output dist/standalone --whisper dist/whisper
      - name: Test the bundled executable
        shell: python
        run: |
          import os, subprocess, sys
          exe = 'tokensaver-docs.exe' if os.name == 'nt' else 'tokensaver-docs'
          env = dict(os.environ, TOKENSAVER_DOCS_STANDALONE=os.path.abspath('dist/standalone/' + exe))
          subprocess.run([sys.executable, '-m', 'unittest', 'discover', '-s', 'tests', '-v'], env=env, check=True)
      - name: Package plugins
        shell: python
        run: |
          import os, subprocess, sys
          exe = 'tokensaver-docs.exe' if os.name == 'nt' else 'tokensaver-docs'
          subprocess.run([sys.executable, 'scripts/package_plugins.py', '--binary', 'dist/standalone/' + exe, '--output', 'dist/plugins', '--bundle-opencode'], check=True)
      - run: python scripts/archive_plugins.py --plugins dist/plugins --output dist/release
      - name: Test OpenCode preparation and read redirection
        shell: python
        run: |
          import os, subprocess, sys
          env = dict(os.environ, TOKENSAVER_DOCS_PLUGIN=os.path.abspath('dist/plugins/opencode/index.js'))
          subprocess.run([sys.executable, '-m', 'unittest', 'discover', '-s', 'tests', '-p', 'test_opencode_plugin.py', '-v'], env=env, check=True)
      - uses: actions/upload-artifact@v4
        with:
          name: tokensaver-docs-plugins-${{ runner.os }}-${{ runner.arch }}
          path: dist/release/
