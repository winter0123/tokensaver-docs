[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "file-to-md"
version = "0.3.4"
description = "TokenSaver Docs: prepare documents once and retrieve bounded evidence for AI coding agents"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = ["pypdf>=5,<7", "pypdfium2>=5,<6", "python-docx>=1.1,<2", "openpyxl>=3.1,<4", "Pillow>=13,<14", "imageio-ffmpeg>=0.6,<1", "markdownify>=1.2,<2", "beautifulsoup4>=4.12,<5"]

[project.urls]
Homepage = "https://github.com/winter0123/tokensaver-docs"
Repository = "https://github.com/winter0123/tokensaver-docs"
Issues = "https://github.com/winter0123/tokensaver-docs/issues"

[project.optional-dependencies]
mcp = ["mcp>=1.9,<2"]
tokens = ["tiktoken>=0.7,<1"]

[project.scripts]
file-to-md = "file_to_md.cli:main"
file-to-md-mcp = "file_to_md.cli:mcp_entry"

[tool.setuptools.packages.find]
include = ["file_to_md*"]

[tool.setuptools.package-data]
file_to_md = ["data/*.json"]

[tool.setuptools.data-files]
"share/file-to-md/skills/file-to-md" = ["skills/file-to-md/SKILL.md"]
