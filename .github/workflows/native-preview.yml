name: Native bundle preview

on:
  pull_request:
    paths:
      - 'tokensaver_docs/**'
      - 'plugins/**'
      - 'marketplace-plugin/**'
      - 'skills/**'
      - 'scripts/**'
      - 'tests/**'
      - 'pyproject.toml'
      - '.github/workflows/plugin-build.yml'
      - '.github/workflows/native-preview.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native-build:
    uses: ./.github/workflows/plugin-build.yml
    with:
      ref: ''
