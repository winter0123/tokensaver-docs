name: Bug report
description: Report a reproducible problem without private data
title: '[Bug] '
body:
  - type: textarea
    id: environment
    attributes:
      label: Version, OS, CPU and coding agent
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps and expected result
      description: Use a small synthetic fixture. Remove secrets and personal information.
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual result and redacted error
