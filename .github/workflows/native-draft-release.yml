name: Build verified draft on native version bump

on:
  push:
    branches: [main]
    paths:
      - 'pyproject.toml'
      - 'tokensaver_docs/__init__.py'
      - '.github/workflows/native-draft-release.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check-version:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      new: ${{ steps.version.outputs.new }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: version
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          tag=$(python -c 'from tokensaver_docs import __version__; print("v" + __version__)')
          test "$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml","rb"))["project"]["version"])')" = "${tag#v}"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          if git ls-remote --exit-code --tags origin "refs/tags/$tag" >/dev/null 2>&1; then
            echo "new=false" >> "$GITHUB_OUTPUT"
            echo "Existing tag $tag; no release changes"
          else
            echo "new=true" >> "$GITHUB_OUTPUT"
          fi

  build:
    needs: check-version
    if: needs.check-version.outputs.new == 'true'
    uses: ./.github/workflows/plugin-build.yml
    with:
      ref: ${{ github.sha }}

  draft:
    needs: [check-version, build]
    if: needs.check-version.outputs.new == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/download-artifact@v4
        with:
          pattern: tokensaver-docs-plugins-*
          path: dist/artifacts
      - name: Verify archives and prepare draft release files
        env:
          RELEASE_TAG: ${{ needs.check-version.outputs.tag }}
        run: python scripts/prepare_release.py --artifacts dist/artifacts --output dist/release --tag "$RELEASE_TAG"
      - name: Create tag and unpublished draft
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.check-version.outputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          if git ls-remote --exit-code --tags origin "refs/tags/$RELEASE_TAG" >/dev/null 2>&1; then
            echo "Tag $RELEASE_TAG was created concurrently; refusing to overwrite"
            exit 1
          fi
          git tag "$RELEASE_TAG" "$GITHUB_SHA"
          git push origin "refs/tags/$RELEASE_TAG"
          gh release create "$RELEASE_TAG" --verify-tag --draft --prerelease \
            --title "TokenSaver Docs $RELEASE_TAG" \
            --notes-file dist/release/release-notes.md \
            dist/release/*.zip dist/release/checksums.txt \
            dist/release/install.sh dist/release/install.ps1 \
            dist/release/LICENSE dist/release/NOTICE dist/release/AUTHORS.md
          echo "Created draft: $RELEASE_TAG (NOT published)"
