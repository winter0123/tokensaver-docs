[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "tokensaver-docs"
version = "0.4.1"
description = "TokenSaver Docs: prepare documents once and retrieve bounded evidence for AI coding agents"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE", "NOTICE", "AUTHORS.md"]
authors = [{name = "winter0123"}]
requires-python = ">=3.11"
dependencies = ["pypdf>=5,<7", "pypdfium2>=5,<6", "python-docx>=1.1,<2", "openpyxl>=3.1,<4", "Pillow>=13,<14", "imageio-ffmpeg>=0.6,<1", "markdownify>=1.2,<2", "beautifulsoup4>=4.12,<5"]

[project.urls]
Homepage = "https://github.com/winter0123/tokensaver-docs"
Repository = "https://github.com/winter0123/tokensaver-docs"
Issues = "https://github.com/winter0123/tokensaver-docs/issues"

[project.optional-dependencies]
mcp = ["mcp>=1.9,<2"]
tokens = ["tiktoken>=0.7,<1"]

[project.scripts]
tokensaver-docs = "tokensaver_docs.cli:main"
tokensaver-docs-mcp = "tokensaver_docs.cli:mcp_entry"

[tool.setuptools.packages.find]
include = ["tokensaver_docs*"]

[tool.setuptools.package-data]
tokensaver_docs = ["data/*.json"]

[tool.setuptools.data-files]
"share/tokensaver-docs/skills/tokensaver-docs" = ["skills/tokensaver-docs/SKILL.md"]
